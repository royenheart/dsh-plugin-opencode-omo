# Calls the reusable workflow of royenheart/dsh-migrate-bot, pinned to its
# release candidate v1.0.0-rc.1 (move to @v1 once 1.0.0 is released). The jobs
# live there; this file only chooses the triggers.
# 0 13 * * 2 = 21:00 UTC+8 every Tuesday.

name: dsh-migrate

on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      dsh_release:
        description: dsh release to migrate the plugins to, such as 0.2.1-rc.2 (empty = the target in .github/dsh-migrate.yml, by default the newest dsh release)
        required: false
        type: string
      migrate_again:
        description: Migrate again to a dsh release this repository was already migrated to, which is skipped otherwise (never while that release's proposal pull request is open)
        required: false
        type: boolean
        default: false
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-migrate:
    uses: royenheart/dsh-migrate-bot/.github/workflows/migrate.yml@v1.0.0-rc.1
    with:
      target: ${{ inputs.dsh_release || '' }}
      force: ${{ inputs.migrate_again || false }}
    secrets: inherit
