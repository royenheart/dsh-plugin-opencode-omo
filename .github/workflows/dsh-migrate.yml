# Calls the reusable workflow of royenheart/dsh-migrate-bot, pinned to its
# release candidate v1.0.0-rc.1 (move to @v1 once 1.0.0 is released). The jobs
# live there; this file only chooses the triggers.
# 0 13 * * 2 = 21:00 UTC+8 every Tuesday.

name: dsh-migrate

on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      target:
        description: Target release (empty = the configured one)
        required: false
        type: string
      force:
        description: Migrate even when the target release was already processed, unless its proposal is still open
        required: false
        type: boolean
        default: false
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh-migrate:
    uses: royenheart/dsh-migrate-bot/.github/workflows/migrate.yml@v1.0.0-rc.1
    with:
      target: ${{ inputs.target || '' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
